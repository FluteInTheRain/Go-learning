# docker-compose.yml
services:
  api:
    build: . # Build image from the Dockerfile in the current dir
    ports:
      - "8080:8080" # host:container port mapping
    env_file: .env # Load variables from .env file
    environment:
      # "db" is the DNS name of the db service on the shared network
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy # wait until db passes its healthcheck

  db:
    image: postgres:16-alpine
    env_file: .env # Load variables from .env file
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data # persist data across restarts
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db-data:
